<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <link rel="dns-prefetch" href="https://script.google.com">
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://lh3.googleusercontent.com">
  
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#1a2a1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ABSEN SDIM">
  <link rel="apple-touch-icon" href="/icon-192.png">
  
  <title>Absensi Kantor — SRIKANDI</title>
  
  <style>
    /* ===== RESET ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f1f5f9;
      overflow: hidden;
    }

    /* ===== IFRAME ===== */
    #appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ===== LOADING OVERLAY ===== */
    #loadingOverlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.5s ease;
    }
    #loadingOverlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner-container {
      position: relative;
      width: 56px;
      height: 56px;
    }
    .spinner {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      border: 5px solid #dbeafe;
      border-top-color: #3b82f6;
      animation: spin 0.8s linear infinite;
    }
    .spinner-inner {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-text {
      font-size: 15px;
      font-weight: 600;
      color: #1e293b;
      letter-spacing: 0.3px;
    }
    .loading-sub {
      font-size: 13px;
      color: #64748b;
      margin-top: -6px;
    }

    .progress-wrap {
      width: 220px;
      max-width: 70vw;
      height: 4px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-top: 4px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6, #667eea, #764ba2);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .loading-tips {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
      margin-top: 4px;
      min-height: 36px;
    }

    .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 12px 30px rgba(102, 126, 234, 0.3);
      margin-bottom: 4px;
    }

    @media (max-width: 480px) {
      .logo-icon { width: 52px; height: 52px; font-size: 22px; }
      .loading-text { font-size: 14px; }
      .loading-sub { font-size: 12px; }
      .progress-wrap { width: 180px; }
    }

    /* ============================================================
       ⚠️ TOAST GPS DI TENGAH
       ============================================================ */
    #gpsToast {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 99999;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      animation: fadeIn 0.3s ease;
    }
    #gpsToast.show {
      display: flex;
    }

    .toast-box {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px 28px 28px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: popIn 0.3s ease;
    }
    .toast-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .toast-title {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .toast-desc {
      font-size: 13px;
      color: #475569;
      line-height: 1.6;
      margin-bottom: 20px;
    }
    .toast-btn {
      padding: 12px 28px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.15s;
      width: 100%;
    }
    .toast-btn:active {
      transform: scale(0.97);
      opacity: 0.8;
    }
    .toast-btn.secondary {
      background: #f1f5f9;
      color: #0f172a;
      margin-top: 8px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    /* ============================================================
       SEMBUNYIKAN PERINGATAN IFRAME DARI GAS
       ============================================================ */
    .gas-iframe-warning,
    [data-gas-iframe-warning],
    .app-iframe-warning,
    #gas-iframe-warning,
    .fallback-banner,
    #fallbackBanner,
    .iframe-warning {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      height: 0 !important;
      width: 0 !important;
      position: absolute !important;
      left: -9999px !important;
    }
  </style>
</head>
<body>

  <!-- ===== LOADING OVERLAY ===== -->
  <div id="loadingOverlay">
    <div class="logo-icon">📋</div>
    <div class="loading-text">⏳ Memuat Aplikasi Absensi</div>
    <div class="loading-sub">Mohon tunggu sebentar...</div>
    
    <div class="spinner-container">
      <div class="spinner"></div>
      <div class="spinner-inner">📱</div>
    </div>

    <div class="progress-wrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="loading-tips" id="loadingTips">
      💡 Pastikan GPS aktif untuk absensi lokasi
    </div>
  </div>

  <!-- ===== IFRAME ===== -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzNSXsEK-m6alZqChxArWUR4-nYLlnFp7Vmwpueg-jcj2hq54HWtdOJ2__wLR6J3iA2hg/exec"
    allow="geolocation *; camera *"
    allowfullscreen
  ></iframe>

  <!-- ===== TOAST GPS DI TENGAH ===== -->
  <div id="gpsToast">
    <div class="toast-box">
      <div class="toast-icon">📍</div>
      <div class="toast-title">GPS Diperlukan</div>
      <div class="toast-desc">
        Aktifkan GPS dan izinkan akses lokasi di browser agar absensi bisa berjalan normal.
      </div>
      <button class="toast-btn" onclick="tutupGpsToast()">Saya Mengerti</button>
      <button class="toast-btn secondary" onclick="bukaPengaturanGPS()">Buka Pengaturan GPS</button>
    </div>
  </div>

  <script>
    (function() {
      'use strict';

      // 🔥 GANTI URL INI DENGAN WEB APP GAS-MU
      var GAS_URL = 'https://script.google.com/macros/s/AKfycbzNSXsEK-m6alZqChxArWUR4-nYLlnFp7Vmwpueg-jcj2hq54HWtdOJ2__wLR6J3iA2hg/exec';

      var overlay = document.getElementById('loadingOverlay');
      var progressBar = document.getElementById('progressBar');
      var tipsEl = document.getElementById('loadingTips');
      var frame = document.getElementById('appFrame');

      // ===== TIPS =====
      var tips = [
        '💡 Pastikan GPS aktif untuk absensi lokasi',
        '📸 Selfie akan digunakan untuk verifikasi wajah',
        '📍 Absensi hanya bisa dilakukan di radius kantor',
        '⏰ Jangan lupa absen masuk dan pulang',
        '🔒 Data Anda aman dengan enkripsi',
        '📊 Lihat riwayat absensi di menu Riwayat',
        '👤 Ganti PIN secara berkala di menu Akun',
        '📱 Aplikasi ini dioptimalkan untuk HP',
        '⚡ Koneksi internet stabil mempercepat proses'
      ];

      function randomTips() {
        var idx = Math.floor(Math.random() * tips.length);
        tipsEl.textContent = tips[idx];
      }

      // ===== PROGRESS BAR =====
      function fakeProgress() {
        var progress = 0;
        var interval = setInterval(function() {
          var inc = Math.random() * 8 + 2;
          progress = Math.min(progress + inc, 95);
          progressBar.style.width = progress + '%';
          if (Math.floor(progress / 10) % 2 === 0) randomTips();
          if (progress >= 95) clearInterval(interval);
        }, 300);
        return interval;
      }

      fakeProgress();
      randomTips();

      // ===== SEMBUNYIKAN LOADING =====
      frame.addEventListener('load', function() {
        progressBar.style.width = '100%';
        tipsEl.textContent = '✅ Selesai!';
        setTimeout(function() {
          overlay.classList.add('hidden');
          setTimeout(function() { overlay.style.display = 'none'; }, 500);
        }, 400);
      });

      setTimeout(function() {
        overlay.classList.add('hidden');
        setTimeout(function() { overlay.style.display = 'none'; }, 500);
      }, 8000);

      // ===== TOAST GPS =====
      function showGpsToast() {
        var toast = document.getElementById('gpsToast');
        if (toast) toast.classList.add('show');
      }

      function tutupGpsToast() {
        var toast = document.getElementById('gpsToast');
        if (toast) toast.classList.remove('show');
      }

      function bukaPengaturanGPS() {
        if (confirm('Buka pengaturan lokasi? (Anda akan keluar dari aplikasi)')) {
          window.location.href = 'intent://settings/location#Intent;action=android.settings.LOCATION_SOURCE_SETTINGS;end';
        }
      }

      // Ekspos ke global
      window.showGpsToast = showGpsToast;
      window.tutupGpsToast = tutupGpsToast;
      window.bukaPengaturanGPS = bukaPengaturanGPS;

      // ===== DETEKSI GPS =====
      if (navigator.permissions && navigator.permissions.query) {
        navigator.permissions.query({ name: 'geolocation' })
          .then(function(res) {
            if (res.state === 'denied') showGpsToast();
            res.onchange = function() {
              if (res.state === 'denied') showGpsToast();
              else if (res.state === 'granted') tutupGpsToast();
            };
          })
          .catch(function() {});
      }

      // ===== DETEKSI INAPP BROWSER =====
      var ua = navigator.userAgent || '';
      var isInApp = /FBAN|FBAV|Instagram|Line\/|WhatsApp|Twitter|TikTok/i.test(ua);
      if (isInApp) showGpsToast();

      // ===== KONEKSI =====
      if (!navigator.onLine) {
        tipsEl.textContent = '⚠️ Tidak ada koneksi internet. Periksa jaringan Anda.';
        progressBar.style.width = '30%';
      }

      window.addEventListener('online', function() {
        tipsEl.textContent = '✅ Koneksi pulih. Melanjutkan...';
        progressBar.style.width = '60%';
      });

      window.addEventListener('offline', function() {
        tipsEl.textContent = '⚠️ Koneksi terputus. Menunggu jaringan...';
        progressBar.style.width = '30%';
      });

      setInterval(randomTips, 4000);
      console.log('✅ Mini-index with center GPS Toast ready!');

    })();
  </script>
</body>
</html>
