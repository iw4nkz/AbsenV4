<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Panel Admin — SRIKANDI</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{
      height:100%;overflow:hidden;
      font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial;
      background:#f1f5f9;
    }
    #appFrame{width:100%;height:100%;border:none;display:block}

    #loadingOverlay{
      position:fixed;inset:0;background:#f1f5f9;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;z-index:10;transition:opacity .3s;
    }
    .spinner{
      width:38px;height:38px;border-radius:50%;
      border:4px solid #dbeafe;border-top-color:#3b82f6;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    #loadingOverlay p{font-size:13px;color:#475569;font-weight:600}
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p>Memuat panel admin...</p>
  </div>

  <!-- GANTI URL DI BAWAH INI DENGAN URL WEB APP GAS (…/exec) + ?page=admin -->
  <iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbzNSXsEK-m6alZqChxArWUR4-nYLlnFp7Vmwpueg-jcj2hq54HWtdOJ2__wLR6J3iA2hg/exec?page=admin"
    allow="geolocation *; camera *"
    allowfullscreen
  ></iframe>

  <script>
    const frame = document.getElementById('appFrame');
    const overlay = document.getElementById('loadingOverlay');
    let overlayHidden = false;
    function hideOverlay_() {
      if(overlayHidden) return;
      overlayHidden = true;
      overlay.style.opacity = '0';
      setTimeout(() => overlay.remove(), 300);
    }
    frame.addEventListener('load', hideOverlay_);
    setTimeout(hideOverlay_, 4000);
  </script>
</body>
</html>
